name: Update LeetCode heatmap

on:
  schedule:
    # 04:17 UTC daily — refresh the live submission grid.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap from LeetCode GraphQL
        env:
          LEETCODE_USERNAME: Oru388f3ta
        run: python3 scripts/generate_cards.py --heatmap-only

      - name: Commit the updated grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/heatmap.svg
          if git diff --staged --quiet; then
            echo "No heatmap changes"
          else
            git commit -m "chore: refresh LeetCode submission grid"
            git push
          fi
